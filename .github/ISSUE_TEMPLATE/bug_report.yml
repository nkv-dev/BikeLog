name: Bug report
description: Report a problem you encountered while using or deploying BikeLog.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug, including expected vs. actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the issue (plus a repo layout, page, or route involved).
      placeholder: |
        1. Go to Settings → GitHub Sync
        2. Connect GitHub and select a repo
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/device, and whether you're on the hosted app or self-hosted.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console / network errors
      description: Any relevant console output, network error, or worker response.
    validations:
      required: false